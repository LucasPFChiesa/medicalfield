# MedicalField - arquivos estáticos e proxy reverso para os três serviços.
# O certbot acrescenta o bloco HTTPS (porta 443) e o redirecionamento.

# Só o app do socorrista rodando no notebook (localhost) pode chamar a API
# a partir de outro endereço. Qualquer outra origem fica sem permissão.
map $http_origin $origem_permitida {
    default "";
    "~^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$" $http_origin;
}

upstream api1 { server 127.0.0.1:8001; }  # Python - autenticação, logs e documentos
upstream api2 { server 127.0.0.1:8002; }  # Go     - prontuários e sincronização
upstream api3 { server 127.0.0.1:3001; }  # Node   - pessoas, medicamentos e atendimentos

server {
    listen 80;
    listen [::]:80;
    server_name medicalfield.duckdns.org;

    root /opt/medicalfield/web;
    index index.html;
    client_max_body_size 2m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Cada caminho da API vai para a API dona dele.
    location ~ ^/api/(auth|log|email|documento|profissional|auditoria|openapi/api1\.json)(/|$) {
        proxy_pass http://api1;
        include snippets/medicalfield-cors.conf;
    }
    location ~ ^/api/(prontuario|sync|openapi/api2\.json)(/|$) {
        proxy_pass http://api2;
        include snippets/medicalfield-cors.conf;
    }
    location ~ ^/api/(pessoa|medicamento|atendimento|openapi/api3\.json)(/|$) {
        proxy_pass http://api3;
        include snippets/medicalfield-cors.conf;
    }
    # Usado pelo app para saber se o servidor está alcançável (não gera log).
    location = /api/ping {
        access_log off;
        add_header Cache-Control "no-store";
        include snippets/medicalfield-cors.conf;
        return 204;
    }
    location /api/ {
        default_type application/json;
        return 404 '{"erro": "Rota não encontrada"}';
    }

    # O navegador sempre confere se há versão nova do Service Worker.
    location = /socorrista/sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
