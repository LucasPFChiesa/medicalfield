# MedicalField - arquivos estáticos e proxy reverso para os três serviços.
# O certbot acrescenta o bloco HTTPS (porta 443) e o redirecionamento.

upstream cadastros    { server 127.0.0.1:3001; }
upstream atendimentos { server 127.0.0.1:8001; }
upstream sincronizacao { server 127.0.0.1:8002; }

server {
    listen 80;
    listen [::]:80;
    server_name medicalfield.duckdns.org;

    root /opt/medicalfield/web;
    index index.html;
    client_max_body_size 2m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Cada caminho da API vai para o serviço dono dele.
    location ~ ^/api/(auth|pessoa|prontuario|medicamento|profissional|auditoria|openapi/cadastros\.json)(/|$) {
        proxy_pass http://cadastros;
    }
    location ~ ^/api/(atendimento|openapi/atendimentos\.json)(/|$) {
        proxy_pass http://atendimentos;
    }
    location ~ ^/api/(sync|log|openapi/sync\.json)(/|$) {
        proxy_pass http://sincronizacao;
    }
    # Usado pelo app para saber se o servidor está alcançável (não gera log).
    location = /api/ping {
        access_log off;
        add_header Cache-Control "no-store";
        return 204;
    }
    location /api/ {
        default_type application/json;
        return 404 '{"erro": "Rota não encontrada"}';
    }

    # O navegador sempre confere se há versão nova do Service Worker.
    location = /socorrista/sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
