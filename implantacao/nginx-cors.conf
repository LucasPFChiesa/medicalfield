# Permite que o app do socorrista aberto no notebook (http://localhost:porta)
# chame a API da VM. Instalado em /etc/nginx/snippets/medicalfield-cors.conf
# e incluído em cada location da API. $origem_permitida vem do "map" do site.
add_header Access-Control-Allow-Origin $origem_permitida always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
add_header Access-Control-Expose-Headers "Content-Disposition" always;
add_header Access-Control-Max-Age 600 always;
add_header Vary Origin always;

# Pergunta prévia do navegador (preflight): responde aqui, sem chegar aos serviços.
if ($request_method = OPTIONS) {
    return 204;
}
