<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d6a85">
  <title>MedicalField – Socorrista</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icone.svg">
  <link rel="stylesheet" href="/comum/estilo.css">
</head>
<body>
  <header class="topo">
    <div class="marca">MedicalField <span>· Socorrista</span></div>
    <div class="conexao">
      <span id="indicador" class="indicador">...</span>
      <span>Simular:</span>
      <div class="chave" role="group" aria-label="Simular conectividade">
        <button type="button" data-simular="online">ONLINE</button>
        <button type="button" data-simular="offline">OFFLINE</button>
      </div>
    </div>
    <button type="button" class="pequeno oculto" id="botao-sincronizar">Sincronizar <span id="contador-pendentes" class="contador">0</span></button>
    <span class="usuario oculto" id="usuario"></span>
    <button type="button" class="pequeno oculto" id="sair">Sair</button>
  </header>

  <section id="tela-login" class="caixa-login painel oculto">
    <h1>Entrar</h1>
    <p id="aviso-login" class="vazio"></p>
    <div id="msg-login" class="mensagem"></div>
    <form id="form-login" class="grade">
      <div>
        <label for="tipo_registro">Tipo de registro</label>
        <select id="tipo_registro" name="tipo_registro">
          <option value="CRM">CRM (médico)</option>
          <option value="COREN">COREN (enfermeiro)</option>
          <option value="SOCORRISTA">ID de socorrista (socorrista)</option>
        </select>
      </div>
      <div><label for="numero_registro">Número</label><input id="numero_registro" name="numero_registro" required autocomplete="username"></div>
      <div><label for="senha">Senha</label><input id="senha" name="senha" type="password" required autocomplete="current-password"></div>
      <button type="submit">Entrar</button>
    </form>
    <p><a href="/portal/">Ir para o portal administrativo</a></p>
  </section>

  <div id="tela-app" class="layout oculto">
    <nav class="menu" id="menu">
      <a href="#inicio">Início</a>
      <a href="#pacientes">Pacientes</a>
      <a href="#novo-atendimento">Registrar atendimento</a>
      <a href="#atendimentos">Atendimentos</a>
      <a href="#medicamentos">Medicamentos</a>
      <a href="#sincronizacao">Sincronização</a>
    </nav>
    <main class="conteudo">
      <div id="msg" class="mensagem"></div>
      <div id="pagina"></div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
