<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedicalField – API</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>body { margin: 0; background: #fff; }</style>
</head>
<body>
  <div id="swagger"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>
  <script>
    // Cada serviço publica a própria especificação OpenAPI.
    SwaggerUIBundle({
      dom_id: '#swagger',
      urls: [
        { name: 'API 1 - Autenticação, logs e documentos (Python)', url: '/api/openapi/api1.json' },
        { name: 'API 2 - Prontuários e sincronização (Go)', url: '/api/openapi/api2.json' },
        { name: 'API 3 - Pessoas, medicamentos e atendimentos (Node.js)', url: '/api/openapi/api3.json' },
      ],
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: 'StandaloneLayout',
      persistAuthorization: true,
    });
  </script>
</body>
</html>
